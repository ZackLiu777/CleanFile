name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: CleanMyIPhone.xcodeproj
  SCHEME: CleanMyIPhone
  DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=latest

jobs:
  unit-tests:
    name: Build and Unit Tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build unit tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:CleanMyIPhoneTests \
            -derivedDataPath "$RUNNER_TEMP/CleanFileUnitDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:CleanMyIPhoneTests \
            -derivedDataPath "$RUNNER_TEMP/CleanFileUnitDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/CleanFileUnitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unit-test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CleanFile-unit-test-results
          path: ${{ runner.temp }}/CleanFileUnitTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ui-tests:
    name: UI Tests
    runs-on: macos-26
    needs: unit-tests
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Build UI tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:CleanMyIPhoneUITests \
            -derivedDataPath "$RUNNER_TEMP/CleanFileUIDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:CleanMyIPhoneUITests \
            -derivedDataPath "$RUNNER_TEMP/CleanFileUIDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/CleanFileUITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload UI-test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CleanFile-ui-test-results
          path: ${{ runner.temp }}/CleanFileUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
